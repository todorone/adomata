name: Checks

on:
   push:
      branches:
         - master
   pull_request:
      branches:
         - master

jobs:
   check:
      runs-on: ubuntu-latest
      timeout-minutes: 4

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - uses: pnpm/action-setup@v4
           name: Install pnpm
           with:
              run_install: false

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 24.x
              cache: pnpm

         - name: Install dependencies
           run: pnpm install

         - name: Prettier formatting check
           run: pnpm format-check

         - name: Lint check
           run: pnpm lint

         - name: TS types check
           run: pnpm types

         - name: Unit tests
           run: pnpm unit -- --maxWorkers=2
